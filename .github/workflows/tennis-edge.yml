# Tennis Edge: keep the live site's data current with no credential anywhere.
#
# The first design had this job push state into Postgres with the Supabase service-role key,
# which meant the whole system waited on one secret reaching one settings page. That is now
# inverted. This workflow rebuilds the walk-forward rating state and commits it to the
# repository, using the token GitHub already gives it. The database pulls the file itself on
# a pg_cron schedule (tennis.pull_state, Tuesdays 07:00 UTC, an hour after this).
#
# So there is no Supabase secret to add, and none to leak, because none exists.
name: tennis-edge

on:
  push:
    branches: [claude/project-files-followup-dif8al]
    paths:
      - 'tennis-edge/**'
      - 'supabase/functions/**'
      - 'artifacts/**'
      - '.github/workflows/tennis-edge.yml'
  schedule:
    # Tuesday 06:00 UTC. The provider's own Last-Modified stamps (S8 pre-check, TE-0029)
    # show the season files publish Sunday/Monday EVENING - a Monday-morning run misses
    # the Monday drop and serves it a week late. Tuesday captures both tours' updates at
    # the measured publication floor; cadence stays weekly, as the provider does.
    - cron: '0 6 * * 2'
  workflow_dispatch:

concurrency:
  group: tennis-edge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    # The port guard. If the TypeScript serving the site has drifted from the Python that was
    # measured, the site is showing numbers no evidence supports — and the two copies look
    # identical from outside. Nothing downstream runs until these 500 cases agree to 1e-12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 500 golden vectors, Python vs TypeScript, 1e-12
        run: deno test --allow-read supabase/functions/tips/

  tests:
    runs-on: ubuntu-latest
    # The coherence suite alone is ~50 minutes of exact-arithmetic solving. 45 was under it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install the PROJECT, not a hand-written list of package names. The list drifted
      # from what the code imports - it never carried PyYAML - and pytest aborts collection
      # on the first ImportError, so the job died in two seconds having run nothing while
      # reporting the whole suite red. A hand-maintained dependency list beside a
      # pyproject.toml is two sources of truth, and this one was silently wrong for weeks.
      - run: pip install --quiet -e ".[dev]"
        working-directory: tennis-edge
      # Collect before running. A collection error and a test failure are different
      # problems with different fixes, and the -q summary makes them look alike.
      - name: Every test module imports
        working-directory: tennis-edge
        run: python -m pytest tests --collect-only -q
      - name: The whole suite, including coherence
        working-directory: tennis-edge
        run: python -m pytest tests -q

  refresh:
    needs: [verify, tests]
    # A push can also ask for a refresh by saying so in its commit message — the only
    # trigger available to an integration that cannot call workflow_dispatch.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pytest openpyxl xlrd

      # A fresh runner has no corpus, and build_state refuses to guess: without this
      # step the whole job dies at "no corpus vintage on disk". (Latent from the first
      # version — the scheduled job had never actually run when this was found.)
      - name: Fetch the corpus (Sackmann archive + Tennis-Data vintages)
        env:
          TENNIS_EDGE_DATA: ${{ runner.temp }}/tennis-data
        working-directory: tennis-edge
        run: |
          set -euo pipefail
          mkdir -p "$TENNIS_EDGE_DATA"
          python -m tennis_edge.archive
          python -c "
          import datetime as dt
          from tennis_edge.refresh import refresh
          print(refresh(now_utc=dt.datetime.now(dt.timezone.utc)).report())
          "

      # BEFORE the rebuild, on purpose: the committed live-state.json is last week's
      # state, whose pre-match existence git history proves. Scoring with this week's
      # state would grade the model on results it had already absorbed.
      - name: Grade last week's matches with the state that predicted them
        env:
          TENNIS_EDGE_DATA: ${{ runner.temp }}/tennis-data
        working-directory: tennis-edge
        run: python tools/export_forecasts.py

      - name: Rebuild walk-forward state
        env:
          TENNIS_EDGE_DATA: ${{ runner.temp }}/tennis-data
        working-directory: tennis-edge
        run: |
          set -euo pipefail
          python -c "
          import datetime as dt
          from tennis_edge.live_state import build_state, save_state
          # as_of is today: the state absorbs every result strictly before the matches it
          # will be asked to price, and refuses to price backwards.
          snapshot = build_state(dt.date.today())
          save_state('../artifacts/live-state.json', snapshot)
          print('players', len(snapshot.players), 'as of', snapshot.as_of)
          "

      - name: Export recent results for the scorecard
        env:
          TENNIS_EDGE_DATA: ${{ runner.temp }}/tennis-data
        working-directory: tennis-edge
        run: python tools/export_results.py

      - name: Regenerate golden vectors
        working-directory: tennis-edge
        run: python tools/emit_golden_vectors.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: The port must still agree after a state rebuild
        run: deno test --allow-read supabase/functions/tips/

      - name: Commit the refreshed state for the database to pull
        run: |
          set -euo pipefail
          git config user.name  "tennis-edge refresh"
          git config user.email "noreply@github.com"
          git add artifacts/live-state.json artifacts/results.json \
                  artifacts/forecasts.json supabase/functions/tips/golden.json
          # A week with no new results is an ordinary week, not a failure.
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "refresh: walk-forward state as of $(date -u +%F)"
          git push

      - name: Confirm the site is answering
        run: |
          set -euo pipefail
          curl -sS --fail \
            https://sujrylzzxcqxxfygptns.supabase.co/functions/v1/tips/health | tee /dev/stderr \
            | grep -q '"ok":true'
