# Deploy the `tips` Edge Function from the repository's own bytes.
#
# WHY THIS EXISTS. Until now the function was deployed by pasting file contents into a
# management API call by hand. That is a transcription step sitting directly in front of
# scoring.ts — the one file whose header says a silent divergence between the Python and
# the TypeScript "is the single most dangerous failure this system can have: the site
# would show numbers that no measurement ever validated, and they would look exactly like
# the validated ones."
#
# The 500 golden vectors guarantee that the TypeScript IN THE REPOSITORY agrees with the
# Python to 1e-12. They guarantee nothing about a copy retyped on the way to the server.
# This workflow closes that gap by deploying the bytes the tests actually ran against, and
# it refuses to deploy at all unless they pass first.
name: deploy-tips

on:
  push:
    # The working branch deploys too: it is the branch the live function has always been
    # built from in practice (v15 was deployed from it by hand), and the alternative —
    # pasting file contents into a management API call — is the transcription risk this
    # workflow exists to close. The golden-vector gate below runs either way.
    branches: [main, claude/project-files-followup-dif8al]
    paths:
      - "supabase/functions/tips/**"
      - ".github/workflows/deploy-tips.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two deploys racing would make "what is live" a question nobody can answer.
  group: deploy-tips
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The gate. The golden vectors replay 500 cases emitted by the Python and fail on
      # any disagreement beyond 1e-12; the board, venue, surface and timing tests cover
      # the feed helpers. A red suite must stop the deploy, not annotate it.
      - name: Golden vectors and unit tests
        working-directory: supabase/functions/tips
        run: deno test --allow-read

      - name: Type check
        working-directory: supabase/functions/tips
        run: deno check index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as"
            echo "::error::repository secrets before this workflow can deploy."
            exit 1
          fi
          # --no-verify-jwt: /health, /board-refresh and /book-capture are reached by the
          # cron poke and by monitoring without a user session. Every other route calls
          # `owner()` first, which checks a live Supabase session AND an allowlist of one
          # address, so the function authorises itself rather than relying on the gateway.
          supabase functions deploy tips \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      # Proves the deployed function loaded its modules and found the model row. It does
      # NOT prove the arithmetic — nothing served can — which is exactly why the golden
      # vectors run above, against the same bytes this step just shipped.
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/tips/health") && break
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 3))
          done
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::health check failed"; exit 1; }
          echo "$body" | grep -q '"bet_candidate_reachable":false' \
            || { echo "::error::BET_CANDIDATE reported reachable"; exit 1; }
