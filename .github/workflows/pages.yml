# Republish docs/index.html to the gh-pages branch whenever it changes.
#
# The first attempt used the official Pages actions with `enablement: true`, and it failed
# twice — including on manual dispatch — with "Resource not accessible by integration":
# creating the Pages *site object* needs repo-admin permission an Actions token cannot
# hold, and the founder reports the Settings > Pages source control is not visible to
# them either. The route that needs no settings at all is the oldest one: a public repo
# with a gh-pages branch gets Pages auto-enabled from that branch. The branch was created
# and pushed once from the session; this workflow keeps it current.
#
# gh-pages carries ONLY the published page and .nojekyll. Source of truth stays
# docs/index.html on the development branch; delete gh-pages to un-publish.
name: pages

on:
  push:
    branches: [claude/project-files-followup-dif8al]
    paths:
      - 'docs/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish index.html to gh-pages
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: docs/index.html ($GITHUB_SHA)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
