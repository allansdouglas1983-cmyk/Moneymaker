# Publish docs/index.html to GitHub Pages whenever it changes.
#
# History of this file, because every method here was forced by a measured failure:
# 1. The official Pages actions with `enablement: true` failed - creating the Pages *site
#    object* needs repo-admin permission an Actions token cannot hold.
# 2. A gh-pages branch was pushed instead; the auto-enabled legacy build fired exactly ONCE,
#    on branch creation (2026-07-28 11:43), and never again for any subsequent push -
#    GITHUB_TOKEN force-pushes, git-data API pushes and contents-API commits all failed to
#    trigger a rebuild, verified against the pages-build-deployment run list.
# 3. The site object now EXISTS (step 2 created it), which is what step 1 was missing. So
#    this returns to the official flow: build the artifact and deploy it directly. No
#    legacy build hooks involved, so there is nothing to fail to trigger.
#
# The gh-pages branch is no longer the deployment mechanism once this runs; it remains
# only as history until deleted.
name: pages

on:
  push:
    branches: [claude/project-files-followup-dif8al]
    paths:
      - 'docs/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (site already exists; no enablement)
        uses: actions/configure-pages@v5
      - name: Build the artifact
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          touch _site/.nojekyll
          date -u +"%Y-%m-%dT%H:%M:%SZ $GITHUB_SHA" > _site/.build-stamp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
