- id: l8_evidence/june_m1_harness.py::core/NumberReplacer::40
  module: l8_evidence/june_m1_harness.py
  symbol: _sigmoid
  line: 251
  original: z = max(-700.0, min(700.0, z))
  mutated: z = max(-701.0, min(700.0, z))
  operator: NumberReplacer
  group: PROPOSED_EQUIVALENT_REQUIRES_FOUNDER_JUDGMENT
  classification: unreachable-defensive
  behavioural_surface: The overflow-safety clamp bound on the linear predictor before math.exp.
  equivalence_argument: "The clamp (lower clamp -700 -> -701) is a safety bound that only engages at |z|>~700. On the upper\
    \ side, sigmoid(699)=sigmoid(700)=sigmoid(701)=1.0 EXACTLY in float64 (1/(1+exp(-699)) rounds to 1.0). On the lower side,\
    \ sigmoid(-699/-700/-701) ~ 1e-304, a value whose contribution to ga/gb/haa (weight m*(1-m) ~ 1e-304) is negligible versus\
    \ the other terms and vanishes under 6dp rounding; moreover data that drives |z| this large is separable and triggers\
    \ the det<=1e-12 break. The clamp never alters a well-conditioned fit and cannot change the 6dp scorecard. \xA76 clamp/tolerance:\
    \ reachability of |z|>700 requires near-separable data that the singular guard already caps."
  differential_evidence: TestClampReachabilityAndFrozen boundary goldens (p<=1e-12 / p>=1-1e-12) pin log_loss/brier/cil exactly
    and assert cal_slope finite; unchanged under all four clamp mutants.
  tests:
  - TestClampReachabilityAndFrozen::test_clamp_probability_below_epsilon
  - TestClampReachabilityAndFrozen::test_clamp_probability_above_one_minus_epsilon_does_not_overflow
  approved_by: null
