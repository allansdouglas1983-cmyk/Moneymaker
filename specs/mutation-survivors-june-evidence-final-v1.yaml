  group: PROPOSED_EQUIVALENT_REQUIRES_FOUNDER_JUDGMENT
  classification: equivalent-mutant
  behavioural_surface: The sha256-length equality check (len(value) against 71).
  equivalence_argument: The compared value is the integer 71 (=7+64). CPython caches small integers in [-5,256], so every
    int 71 is the SAME object; `len(value) is 71` therefore returns True exactly when len(value)==71 and False otherwise (a
    different length is a different cached/computed int, is-comparison False, matching ==-False). Equivalent on all inputs
    given CPython small-int interning. Relies on a CPython implementation detail (stable across all supported CPython versions);
    founder judgment requested.
  differential_evidence: Length pin tests (both directions) pass identically; no non-interned 71 is constructible for a length
    check.
