- id: l8_evidence/tennis_outcomes.py::core/NumberReplacer::2
  module: l8_evidence/tennis_outcomes.py
  symbol: extract
  line: 264
  original: and market_time[:10] >= _SCOPE_BOUNDARY
  mutated: and market_time[:11] >= _SCOPE_BOUNDARY
  operator: NumberReplacer
  group: PROPOSED_EQUIVALENT_REQUIRES_FOUNDER_JUDGMENT
  classification: equivalent-mutant
  behavioural_surface: The date-prefix slice length used in the June scope-boundary comparison.
  equivalence_argument: '_SCOPE_BOUNDARY = ''2026-06-01'' is exactly 10 chars. marketTime is ISO-8601 ''YYYY-MM-DD[THH:MM:SS...]'',
    so char index 10 is the ''T'' separator (or the string ends). For any X=market_time[:10] and X''=market_time[:11] compared
    with the 10-char boundary B: if X<B then X''<B (shared 10-char prefix); if X>B then X''>B; if X==B then X''=X+''T...''>B,
