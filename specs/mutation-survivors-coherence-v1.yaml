survivor_classification:                 # LEAD proposal for founder ratification (approved_by: null)

  - class: PEP563_TYPE_ANNOTATION_OPERATORS
    count: 1
    disposition: EQUIVALENT
    approved_by: null
    rationale: >-
      Operator mutant on a type-annotation line. The module uses `from __future__ import
      annotations` (PEP 563) and consumes no annotations at runtime (proved by
      tests/unit/xmarket_contracts/test_annotation_architecture.py). Provably equivalent.

  - class: BOUNDED_DP_UNREACHABLE_STATE
    count: 51
    disposition: EQUIVALENT
    approved_by: null
    rationale: >-
      Comparison-operator mutants on the win / terminal boundaries of the game DP (`g`), the
      tiebreak DP (`tb`), `_set_terminal` and `set_distribution` (e.g. `s >= 4` -> `s == 4`,
      `a >= 6` -> `a == 6`). The DP short-circuits — the advantage-game deuce closed form at
      `s == r` and the set 6-6 tiebreak — make the higher states (s=5, a=7 via non-tiebreak,
      etc.) UNREACHABLE, so the mutated and original guards agree on every reachable state.
      Equivalent on the reachable state space.

  - class: GUARD_DOMAIN_EQUIVALENT
    count: 2
    disposition: EQUIVALENT
    approved_by: null
    rationale: >-
      Serve-order guard mutants whose operand domain makes them no-ops: `point_index == 1` ->
      `point_index <= 1` and the `>= 1` variant, where point_index is always >= 1 (1-indexed),
      so the mutated guard has identical truth on every queried index.

  - class: EPS_GUARD_NEVER_CROSSED
    count: 1
    disposition: EQUIVALENT
    approved_by: null
    rationale: >-
      `_EPS = 1e-12` -> a negative value. `_EPS` guards only the deuce-tail fallback
      `if (ff + oo) < _EPS: return 0.5`; for any valid serve probability ff + oo > 0, so neither
      the original nor the mutant ever takes the fallback branch. Equivalent on valid inputs.

  - class: IMMUTABILITY_NOT_VALUE_AFFECTING
    count: 1
    disposition: EQUIVALENT_FOR_VALUES
    approved_by: null
    rationale: >-
      `@dataclass(frozen=True)` -> `frozen=False` on SetResult. This weakens compile-time
      immutability but changes NO computed probability value; every test asserts values, not
      frozen-ness. Proposed equivalent for values; the founder may prefer a killing test that
      asserts SetResult is frozen (a cheap immutability guard) rather than approving it.

  - class: DP_ARITH_OR_LOGIC_UNPROVEN
    count: 80
    disposition: PENDING_FOUNDER_ADJUDICATION
    approved_by: null
    note: >-
      Arithmetic / bit-operator / logic mutants inside the bounded DPs (`g`, `tb`,
      `_set_terminal`, `set_distribution`, `tiebreak_win_prob`, `first_point_win`). The large
      majority are expected equivalent because the operands are small bounded integers on the
      reachable state space (e.g. `s - r` vs `s ^ r` where the `>= 2` guard has identical truth
      on all reachable (s, r)), but the LEAD has NOT completed a per-mutant reachability proof
      for every one, and at least one — the `AddNot` on `tiebreak_win_prob.first_point_win`,
      which inverts the per-point server yet survived the 1e-9 agreement — requires either an
      explicit symmetry proof or a killing test before it may be called equivalent. These are
      NOT claimed equivalent. They are queued for the founder-gated per-ID kill-or-approve
      process (the Stage-2 precedent), and partly for the fuller test suite (match/PMF full-PMF
      agreement) which was excluded from the per-mutant command for runtime.

