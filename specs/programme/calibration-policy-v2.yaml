    sha256:6001657753c8a26ea2ba53e3d323c0a132b1034161b6708d65c2c45e30284470)
  ATP:
    intercept: 0.025399
    temperature: 1.218638
  WTA:
    intercept: 0.029204
    temperature: 1.150681
  forbidden_additions:            # founder §1 — none of these may ever be added
    - player-specific calibration
    - surface-specific calibration
    - probability-band calibration
    - tournament-specific calibration
    - any other calibration method
