provisional_scope_if_ever_activated:      # NOT a general tennis layer
  - F0-committed tennis singles
  - STRICT cohort only
  - correctly linked Total Games and/or Game Handicap market
  - open, pre-match, two-sided and uncrossed
  - parseable line
  - derivative state reconstructed at or before the F0 decision timestamp
  - no later price substitution
  - quote-age policy still pending
  - settlement semantics verified
  - information-origin/redundancy policy verified
not_applicable_to: PRIMARY_ONLY_TIER (under the June evidence)

