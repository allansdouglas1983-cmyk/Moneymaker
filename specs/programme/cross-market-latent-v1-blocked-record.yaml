# ---- §2 research-only preservation ---------------------------------------------------
research_only_preservation:
  modules: research/xmarket/ (parsers, corpus, linkage, reconstruct, redundancy, audit, run_audit)
  classification: audit/research modules — NOT production prediction code
  may_not_feed:
    - a fundamental prediction
    - a final probability
    - a personal tip
    - a shadow candidate
    - any money or execution path
  import_quarantine: >-
    enforced in the Makefile — no path from l5_decision / l5b_risk / l6_broker / l7_settle /
    l3_features / l4_pricing reaches research.xmarket. The operational V0 also may not import
    research.xmarket into its probability path (V0 reads the frozen audit ARTIFACT as
    display-only data, never the live audit code).
  mutation_status: >-
    the current advisory mutation result (973 mutants, 548 killed / 425 survived; two
    integrity-critical boundaries pinned and verified killed) is SUFFICIENT to preserve the
    audit evidence, and is NOT sufficient for a production cross-market predictor.
  on_activation_only:
    - promote only the required parsers, event linkage and snapshot synchronizer
    - move them behind governed production contracts
    - add complete money/advice-critical property and mutation testing
    - do NOT promote diagnostic-only audit arithmetic automatically
