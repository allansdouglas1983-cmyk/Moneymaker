# specs/programme/alpha-consumption-ledger-v1.yaml — programme-level alpha ledger
# (Stage 2B §8). Human-owned. alpha_total = 0.05 family-wise, rationed ONLY by the
# existing multiplicity machinery. This ledger RESERVES allocations; a trial's alpha is
# spent when its confirmatory result is read.

version: alpha-consumption-ledger-v1
alpha_total: "0.05"          # preregistration-constants-v1
rationing: spent = (1 - confidence) * (prior_trials + 1) <= alpha_total  (SPEC-091/gates-v1)

allocations:
  - id: F0-market-yardstick
    alpha_charge: "0.000"
    note: deterministic June market-probability producer; no superiority claim
  - id: F1-structural-null
    alpha_charge: "0.000"
    note: harness leakage proof; no superiority claim
  - id: F2-global-elo
    alpha_charge: "0.000"
    note: REGISTERED BASELINE; makes no superiority claim; consumes no confirmatory alpha
  - id: F3-vs-F2-confirmatory
    alpha_charge: "0.025"      # confidence 0.975
    status: SPENT 2026-07-18 — verdict FAIL_HARM (F3 materially worse; overall mean_d
      -0.0095, 97.5% CI [-0.0120, -0.0071] entirely negative). F3 not promoted; F2 retained.
    powered: "yes at planning sigma_d (34,038 >= 32,212); realised CI decisive"
  - id: future-prospective-M2-market-comparison
    alpha_charge: "0.025"      # confidence 0.975; exhausts the budget
    status: RESERVED for the Stage C FUTURE-PROSPECTIVE M2 stream (Stage 2E amendment
      june-evidence-plan-amendment-v1). June is NO LONGER the M2 confirmation block — it is
      spent as the Stage A M1 external transfer and the Stage B SPEC-032 DEVELOPMENT block
      (development consumes NO alpha). This 0.025 is preserved for future unseen matches.
    was: "June-M2-market-comparison (reclassified 2026-07-18, before any June result)"

remaining_after_reservations: "0.000"

rules:
  - F4 and later families receive NO confirmatory alpha under this registration
  - do NOT reactivate F4 merely because F3 fails
  - any future model-family programme requires a NEWLY governed registration and a new
    evidence period (new lockbox; multiplicity reset is a human-controlled spec change)
  - calibration (temperature scaling v1; affine-logit v2) is a probability-quality
    correction, NOT a superiority trial — it receives no alpha
  # --- Stage 2C §1 finalization (2026-07-18) ---
  - The F3-vs-F2 surface trial is CLOSED FAIL_HARM (specs/programme/f3-closure-record-v1.yaml).
    No further surface-family trial is authorised under this programme or alpha budget.
  - Only the June-M2 reservation (0.025) remains; it is the sole outstanding allocation and
    exhausts the family-wise budget. Spending it requires the staged June opening
    (june-lockbox-staged-opening-runbook) AND Stage A (M1) returning PASS first.
