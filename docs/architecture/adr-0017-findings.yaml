    title: int player_id in sport_core protocols vs str identity in sport_tennis domain
    severity: BLOCKS-TENNIS (at first concrete provider)
    owner_slice: A5
    status: done  # landed 2026-07-17 — namespaced CompetitorId; five tennis protocols relocated to sport_tennis.providers; WeightedElo re-keyed
    note: opaque STRING competitor identity per founder directive; protocols relocate to sport_tennis
