# Licensed-source registry — SPECIFICATION.md §13.2, SPEC-101.
#
# Until a human reviews a source it is `candidate` with unverified rights (null). Rights are a
# LEGAL determination and are NEVER agent-populated. A source is `operational` only when it is
# used in the deployable / betting pipeline; the gate (governance.licensed_sources) fails if an
# operational source is not `permitted` with the required rights. Racing Post / rpscrape-style
# sources MUST stay research-only (operational: false) and out of the deployable pipeline (§13.1).
#
# status:      candidate | permitted
# operational: false until a source is wired into the deployable pipeline

