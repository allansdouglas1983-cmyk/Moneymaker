- id: DR-TENNIS-STAKING-001
  title: Staking, bankroll and ruin - whether a fraction-of-pot rule should replace the fixed
    minimum stake, and what the literature actually supports
  classification: ADVISORY
  status: ASSESSED
  requested: 2026-07-30
  blocking_scope: none — v1 staking rule is UNCHANGED (fixed minimum stake + absolute loss budget)
  authorisation: founder directive 2026-07-30 (/deep-research), the explicit owner authorisation
    the routing protocol requires before Claude runs its own large-agent workflow
  notes:
  - 'verdict: change nothing. Fractional Kelly is justified by PARAMETER UNCERTAINTY (MacLean,
    Thorp & Ziemba 2010, verified verbatim); our edge distribution spans zero at declared execution
    costs (TE-0020), and the honest fraction of Kelly for an edge that may be zero is zero'
  - 'the actionable finding is not a staking rule: log-score edge converts directly into evidence
    accumulation rate under Ville''s inequality, so a log-score evidence process answers in
    measurement what TE-0036 showed a real-money trial cannot afford to answer in money'
  - Ville's inequality is simultaneously the anytime-valid monitoring bound and the risk-of-ruin
    bound (P(ever reaching alpha) <= 1/alpha) — SPEC-096 already specifies exactly this and remains
    planned; the literature confirms the spec, it does not activate it
  - Baker & McHale (2013) Decision Analysis 10(3):189-199 is genuine, peer-reviewed and applies to
    TENNIS specifically, but claimed shrinkage magnitudes were REFUTED and the authors' own 2016
    follow-up contradicts part of the secondary reading
  - '7 of 19 verified claims refuted, all overreach: sources real and quotes verbatim, inferences
    drawn from them in secondary writing not supported'
  - 'PROVENANCE CAVEAT: all 48 workflow agent results recorded null; findings salvaged from agent
    transcripts, synthesis stage never ran, 95 of 114 extracted claims never reached verification
    and are deliberately NOT recorded as findings'
  returned: '2026-07-30'
  findings: docs/research/findings/DR-TENNIS-STAKING-001-findings.md
- id: DR-TENNIS-STAKING-002
  title: Staking and bank-allocation algorithms, named, with measured consequences - supersedes
    the partial 001
  classification: ADVISORY
  status: ASSESSED
  requested: 2026-07-30
  blocking_scope: none - nothing implemented; the founder asked for research BEFORE building
  notes:
  - 'supersedes DR-TENNIS-STAKING-001, which reported only 19 verified claims because the run
    had not finished. Same run at 95 agents: 114 claims, 61 verified, 25 refuted (41%)'
  - 'RECOMMENDED: risk-constrained Kelly (Busseti/Ryu/Boyd), NOT fractional Kelly. Fractional
    Kelly is Pareto-dominated - 0.035 growth vs 0.047 at matched drawdown risk 0.1. Closed-form
    survival constraint E(r^T b)^-lambda <= 1 bounds the ENTIRE minimum-wealth CDF with one
    lambda. Convex, always feasible, refuses non-positive-EV bets by construction'
  - 'full Kelly and max-Sharpe gave 100% RUIN on 7,200 basketball games and 14,400 football
    matches under realistic imperfect estimates. A published tennis study had to cap Kelly at
    1% of bankroll to avoid early bankruptcy'
  - 'safety is cheap: quarter-Kelly cuts P(drawdown>20%) from 25% to 2% while median terminal
    bank falls only 122 -> 109 (Buchdahl, 10,000 runs, 250 bets, 4% edge)'
  - 'stake must FALL as odds lengthen - Kelly fraction is mu/K, so a flat 1% at 20-to-1 is 20x
    Kelly. Ruin at a constant +1% edge: 13% at evens, 34% at 2-1, 64% at 20-1. At 20-1 a +1%
    and a -1% edge are nearly indistinguishable in outcome data'
  - 'size on a Beta-posterior mean, not the plug-in estimate: Bayes-optimal fraction is exactly
    Kelly at (x+a)/(n+a+b). Worked example gives 3.4-5.6% where plug-in Kelly says 8.9%, and a
    tighter prior collapses it 13x'
  - 'REFUTED (25): half-Kelly is NOT universally better - it lost to plug-in Kelly in all four
    of one paper''s experiments (13.268 vs 18.134). Over-tightening a chance constraint is
    actively counterproductive. Martingale refuted in every form (53-78% bankruptcy vs ~0% for
    level staking; EV unchanged by construction)'
  - 'sample sizes govern everything: ~1,675 bets at odds 1.95 for decisive evidence of a +5%
    edge, ~10,400 at odds 7.00; distinguishing a 1.0% from a 1.1% edge needs two million trials'
  - 'PROCESS NOTE: an earlier attempt built an allocator with INVENTED risk parameters (2%
    single cap, 5% daily, 20% reserve, 80% brake) that came from no source. This document
    replaces guessed parameters with named, sourced, measured ones'
  returned: '2026-07-30'
  findings: docs/research/findings/DR-TENNIS-STAKING-002-findings.md
- id: DR-TENNIS-STAKING-003
  title: Completed deep research on staking and bankroll for a small unproven edge - SUPERSEDES
    and REVERSES 002
  classification: ADVISORY
  status: ASSESSED
  requested: 2026-07-30
  blocking_scope: none, but it overturns the recommendation in DR-TENNIS-STAKING-002
  notes:
  - 'the founder''s /deep-research run, completed: 105 agents, 8.26M tokens, 1,290 tool calls,
    2h40m; 11 findings survived three-vote adversarial verification'
  - 'PRIMARY: retain flat minimum stakes + hard loss budget. Adopt NO Kelly rule (full, half,
    quarter or Bayesian-shrunk) while the edge interval spans zero. A mis-signed f* scaled by
    1/4 is still a negative-expectation bet - shrinking changes the SIZE of the mistake, not
    its SIGN. SPEC-060/061 are already what this literature prescribes'
  - 'REVERSES 002, which I wrote from a partial harvest of the same run and which recommended
    risk-constrained Kelly. Not a refinement, a reversal'
  - 'operational arithmetic: at +2.3% ROI full Kelly is 0.47% of bank at odds 6.0 and 11.7% at
    odds 1.2. A GBP 1-2 minimum on a few-hundred-pound bank is 0.3-0.7%, so the minimum stake
    ALREADY EXCEEDS full Kelly on the underdog bets where the edge is strongest - Kelly is
    unimplementable downward - while demanding 11.7% per bet on favourites where the edge is
    weakest'
  - 'over-betting is the specific danger: plug-in Kelly over-bets and the gap grows with
    estimate variance even when unbiased, plus a winner''s curse because bets are FILTERED on
    estimated edge. A bettor whose true edge is half the measured one is betting exactly 2x
    Kelly - the zero-growth point - while believing they are at full Kelly'
  - 'Kelly is the most estimation-sensitive objective in the allocation literature: mean errors
    dominate variance errors ~20:2:1 generally and ~100:3:1 for a log/Kelly bettor'
  - 'USABLE RESULT: for FLAT staking, expected max drawdown has a closed form (Magdon-Ismail et
    al. 2004) - E[MDD] = 1.2533*sigma*sqrt(T) at zero drift; drawdown scale is variance-over-edge
    and DOUBLING THE STAKE EXACTLY DOUBLES EXPECTED DRAWDOWN. This sizes a flat stake from a
    stated drawdown tolerance WITHOUT assuming the edge is positive'
  - 'NEGATIVE FINDING: only angles 1-2 (Kelly, ruin/drawdown maths) produced anything that
    survived. NOTHING survived on angle 3 (what syndicates actually do, CLV, line shopping,
    why martingale fails), angle 4 beyond Kelly (vol targeting, risk parity, anytime-valid
    monitoring), or angle 5 (execution costs, account restriction, model decay). Reason given:
    the practitioner-facing material is dominated by gambling-affiliate content, and excluding
    it leaves very little verifiable evidence. The founder''s central question - what the best
    systems actually do - CANNOT be answered to this standard from public sources'
  returned: '2026-07-30'
  findings: docs/research/findings/DR-TENNIS-STAKING-003-findings.md
