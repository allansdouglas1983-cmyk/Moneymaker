  - methods requiring paid data must be flagged unavailable, not recommended (founder ruled
    out further data purchase 2026-07-27)
- id: DR-TENNIS-MICROSTRUCTURE-001
  title: Last-traded price versus the crossable best-back price pre-off; whether the
    traded-through survival test is a recognised method and how it is biased; current UK
    Betfair tennis commission mechanics
  classification: BLOCKING
  status: REQUESTED
  requested: 2026-07-27
  request: docs/research/requests/DR-TENNIS-MICROSTRUCTURE-001.md
  blocking_scope: any MONEY claim derived from the BASIC archive; forecast-quality claims
    continue unaffected
  notes:
  - BASIC carries no ladder and no traded volume; a return settled at LTP embeds an
    invisible assumption that every claimed fill happened
  - measured on 27,209 priced matches, both sides - SUPPORTED 64.4%, UNSUPPORTED 18.7%,
    NO_EVIDENCE 16.9%; a naive settlement would credit 35% of fills the record does not support
  - until answered, BASIC-derived returns are reported as hypothetical with the three-way
    split shown, never as realised returns
