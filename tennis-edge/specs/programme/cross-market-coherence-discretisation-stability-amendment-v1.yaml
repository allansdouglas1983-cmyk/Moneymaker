# STAGE3-0006C-D-A3. Does NOT modify the existing CROSS_MARKET_COHERENCE_V1 registration or the
# A1 root-dedup amendment in place; this file amends them additively. The prior behaviour remains
# permanent historical evidence (SOLVER_GOLDEN_V1_SEQUENCE_DEFINED, SOLVER_GOLDEN_V2_CANONICAL_
# SET_DEFINED, SOLVER_DEGENERACY_* diagnostic artifacts).
amendment_id: CROSS_MARKET_COHERENCE_DISCRETISATION_STABILITY_AMENDMENT_V1
amendment_authority: founder
directive: STAGE3-0006C-D-A3
responds_to: AMENDMENT_DISCRETISATION_STABILITY_REQUIRED  # STAGE3-0006C-D-A2 verdict
amendment_reason: >
  On extended sub-tolerance residual valleys the public root count and root locations are
  properties of the scan-lattice seed layout, not of the mathematical target: the four A2
  predeclared lattices produced counts G0=3, G1=4, G2=3, G3=4 on the frozen disputed fixture
  (status MULTIPLE_ROOTS throughout, representatives unpairable one-to-one under the existing
  strict 1e-3 relation), while the independent reference solver converged from all three of its
  resolutions to the single singular deepest point (0.5, 0.5) -> NON_IDENTIFIABLE. A
  discretisation-defined multiplicity must not be published as a set-defined property.

