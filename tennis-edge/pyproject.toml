[project]
name = "tennis-edge"
version = "1.0.0"
description = "Tennis match probabilities from a market-anchored residual model, served as a private website."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # sport_tennis/identity_bridge.py reads the governed name-mapping spec. This was a
    # genuine runtime dependency that nothing declared, so CI - which installed a
    # hand-written list rather than this file - aborted collection on it and reported the
    # whole suite red without running a single test.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis_edge", "sport_tennis", "sport_core", "price_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# Tests carried over from the research platform tag themselves with the requirement they
# cover. The manifest that consumed those tags stayed behind; the tags are harmless and
# still say what a test is for, so they are registered rather than stripped.
markers = ["spec: the requirement this test covers in the originating platform"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["tennis_edge", "sport_tennis", "sport_core", "price_contracts"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG", "B", "UP"]
